<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E342E" />
      <stop offset="100%" stop-color="#2D1B18" />
    </linearGradient>
  </defs>

  <!-- Nadaswaram Pipe (diagonal) -->
  <!-- Reed & Mouthpiece (சீவாளி) -->
  <path d="M18 80 L22 76 L25 79 L21 83 Z" fill="url(#nadGold)" />
  <line x1="16" y1="82" x2="20" y2="78" stroke="#FFE082" stroke-width="1.5" />
  
  <!-- Wooden Body (உடம்பு) -->
  <path d="M22 76 L66 32 L72 38 L28 82 Z" fill="url(#woodGrad)" stroke="url(#nadGold)" stroke-width="0.8" />
  <!-- Finger Holes -->
  <circle cx="32" cy="72" r="1.5" fill="url(#nadGold)" />
  <circle cx="38" cy="66" r="1.5" fill="url(#nadGold)" />
  <circle cx="44" cy="60" r="1.5" fill="url(#nadGold)" />
  <circle cx="50" cy="54" r="1.5" fill="url(#nadGold)" />
  <circle cx="56" cy="48" r="1.5" fill="url(#nadGold)" />
  <circle cx="62" cy="42" r="1.5" fill="url(#nadGold)" />

  <!-- Bell Flare (அனசு / Brass Flare) -->
  <path d="M68 30 C72 26 80 18 88 20 C92 24 84 32 80 36 C76 40 72 34 68 30 Z" fill="url(#nadGold)" stroke="#8B6914" stroke-width="1" />
  <ellipse cx="85" cy="23" rx="6" ry="10" transform="rotate(-45 85 23)" fill="#FFF59D" stroke="url(#nadGold)" stroke-width="1" />

  <!-- Musical Notes Floating -->
  <path d="M24 30 C24 20 32 20 34 26" stroke="url(#nadGold)" stroke-width="1.5" fill="none" />
  <circle cx="24" cy="30" r="2.5" fill="url(#nadGold)" />
  <path d="M70 66 C70 56 78 56 80 62" stroke="url(#nadGold)" stroke-width="1.5" fill="none" />
  <circle cx="70" cy="66" r="2.5" fill="url(#nadGold)" />
</svg>

