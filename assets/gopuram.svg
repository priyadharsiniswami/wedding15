<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="gopuramGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="gopuramDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A050A" />
      <stop offset="100%" stop-color="#2D0306" />
    </linearGradient>
  </defs>

  <!-- Top 7 Stupis / Kalasams -->
  <g fill="url(#gopuramGold)">
    <!-- Central Kalasam -->
    <path d="M100 12 L97 22 L103 22 Z" />
    <circle cx="100" cy="11" r="2.5" />
    <path d="M96 22 H104 V25 H96 Z" />
    <!-- Flanking Kalasams -->
    <path d="M91 15 L88 23 L94 23 Z" /><circle cx="91" cy="14" r="2" />
    <path d="M109 15 L106 23 L112 23 Z" /><circle cx="109" cy="14" r="2" />
    <path d="M82 18 L79 24 L85 24 Z" /><circle cx="82" cy="17" r="1.8" />
    <path d="M118 18 L115 24 L121 24 Z" /><circle cx="118" cy="17" r="1.8" />
    <path d="M73 20 L70 25 L76 25 Z" /><circle cx="73" cy="19" r="1.5" />
    <path d="M127 20 L124 25 L130 25 Z" /><circle cx="127" cy="19" r="1.5" />
  </g>

  <!-- Top Ridge / Barrel Vault Shikara -->
  <path d="M68 25 C80 23 120 23 132 25 C138 28 135 34 130 35 H70 C65 34 62 28 68 25 Z" fill="url(#gopuramGold)" stroke="#6A4E00" stroke-width="0.8" />
  
  <!-- Tier 1 -->
  <rect x="74" y="35" width="52" height="18" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="1.2" rx="1" />
  <path d="M66 53 H134 V57 H66 Z" fill="url(#gopuramGold)" />
  <!-- Tier 1 Miniature niches/pillars -->
  <path d="M82 35 V53 M90 35 V53 M100 35 V53 M110 35 V53 M118 35 V53" stroke="url(#gopuramGold)" stroke-width="1" />
  <circle cx="100" cy="44" r="4" fill="url(#gopuramGold)" opacity="0.8" />

  <!-- Tier 2 -->
  <rect x="66" y="57" width="68" height="22" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="1.2" rx="1" />
  <path d="M58 79 H142 V84 H58 Z" fill="url(#gopuramGold)" />
  <!-- Tier 2 Kudus/niches -->
  <path d="M76 57 V79 M86 57 V79 M96 57 V79 M104 57 V79 M114 57 V79 M124 57 V79" stroke="url(#gopuramGold)" stroke-width="1" />
  <path d="M94 72 C94 66 106 66 106 72 Z" fill="url(#gopuramGold)" />

  <!-- Tier 3 -->
  <rect x="58" y="84" width="84" height="26" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="1.2" rx="1" />
  <path d="M50 110 H150 V116 H50 Z" fill="url(#gopuramGold)" />
  <!-- Tier 3 niches -->
  <path d="M68 84 V110 M78 84 V110 M90 84 V110 M100 84 V110 M110 84 V110 M122 84 V110 M132 84 V110" stroke="url(#gopuramGold)" stroke-width="1" />
  <circle cx="100" cy="98" r="5" fill="url(#gopuramGold)" opacity="0.85" />

  <!-- Tier 4 -->
  <rect x="50" y="116" width="100" height="30" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="1.2" rx="1" />
  <path d="M42 146 H158 V153 H42 Z" fill="url(#gopuramGold)" />
  <!-- Tier 4 niches & carvings -->
  <path d="M60 116 V146 M72 116 V146 M84 116 V146 M96 116 V146 M104 116 V146 M116 116 V146 M128 116 V146 M140 116 V146" stroke="url(#gopuramGold)" stroke-width="1" />
  <path d="M92 138 C92 128 108 128 108 138 Z" fill="url(#gopuramGold)" />

  <!-- Tier 5 (Base Gopuram Level) -->
  <rect x="42" y="153" width="116" height="34" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="1.5" rx="1" />
  <path d="M32 187 H168 V195 H32 Z" fill="url(#gopuramGold)" />
  <!-- Carved Dravidian cornice bracket details -->
  <g stroke="url(#gopuramGold)" stroke-width="1.2">
    <path d="M54 153 V187 M68 153 V187 M82 153 V187 M118 153 V187 M132 153 V187 M146 153 V187" />
  </g>

  <!-- Ground Stone Base / Upapitha & Grand Gateway Entrance (Thiru Vaasal) -->
  <rect x="32" y="195" width="136" height="42" fill="url(#gopuramDark)" stroke="url(#gopuramGold)" stroke-width="2" />
  <!-- Stone Moldings -->
  <line x1="32" y1="205" x2="168" y2="205" stroke="url(#gopuramGold)" stroke-width="1" />
  <line x1="32" y1="230" x2="168" y2="230" stroke="url(#gopuramGold)" stroke-width="1" />
  
  <!-- Temple Gateway Arch & Sacred Sanctum Light -->
  <path d="M84 237 V208 C84 199 116 199 116 208 V237 Z" fill="#FFE082" stroke="url(#gopuramGold)" stroke-width="1.8" />
  <!-- Sanctum Deepam / Glow -->
  <circle cx="100" cy="216" r="4" fill="#FF5722" />
  <path d="M100 208 Q103 214 100 216 Q97 214 100 208 Z" fill="#FFF" />
  
  <!-- Traditional Dvarapalaka / Guardian motifs flanking entrance -->
  <path d="M60 206 H76 V230 H60 Z" fill="none" stroke="url(#gopuramGold)" stroke-width="1" />
  <circle cx="68" cy="214" r="3" fill="url(#gopuramGold)" />
  <path d="M124 206 H140 V230 H124 Z" fill="none" stroke="url(#gopuramGold)" stroke-width="1" />
  <circle cx="132" cy="214" r="3" fill="url(#gopuramGold)" />
</svg>

