<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997410" />
    </linearGradient>
  </defs>

  <!-- Circular Floral Wreath Ring -->
  <circle cx="60" cy="60" r="54" stroke="url(#monoGold)" stroke-width="1.8" stroke-dasharray="4 2" />
  <circle cx="60" cy="60" r="48" stroke="url(#monoGold)" stroke-width="1" />

  <!-- Laurel Leaf Pairs around Ring -->
  <g fill="url(#monoGold)" opacity="0.85">
    <ellipse cx="60" cy="8" rx="3" ry="5" />
    <ellipse cx="60" cy="112" rx="3" ry="5" />
    <ellipse cx="8" cy="60" rx="5" ry="3" />
    <ellipse cx="112" cy="60" rx="5" ry="3" />

    <ellipse cx="23" cy="23" rx="4" ry="2.5" transform="rotate(-45 23 23)" />
    <ellipse cx="97" cy="23" rx="4" ry="2.5" transform="rotate(45 97 23)" />
    <ellipse cx="23" cy="97" rx="4" ry="2.5" transform="rotate(45 23 97)" />
    <ellipse cx="97" cy="97" rx="4" ry="2.5" transform="rotate(-45 97 97)" />
  </g>

  <!-- Monogram Letters V & J -->
  <text x="44" y="68" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="28" font-weight="900" fill="url(#monoGold)" text-anchor="middle">V</text>
  
  <!-- Center Auspicious Heart / Knot -->
  <path d="M60 52 C57 48 52 48 52 53 C52 58 60 64 60 64 C60 64 68 58 68 53 C68 48 63 48 60 52 Z" fill="#E91E63" />

  <text x="76" y="68" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="28" font-weight="900" fill="url(#monoGold)" text-anchor="middle">J</text>

  <!-- Subtitle Wedding Date -->
  <text x="60" y="86" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="url(#monoGold)" text-anchor="middle">15.11.2026</text>
</svg>

