<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <!-- Rich 24K Gold Gradient for Petals -->
    <radialGradient id="petalGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBE6"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <!-- Center Brass Boss Stud Gradient -->
    <radialGradient id="centerGold" cx="32%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
    <!-- Drop Shadow for Realistic 3D Carved Brass Relief -->
    <filter id="brassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#brassShadow)">
    <!-- 8 Carved Golden Flower Petals (Padma Rosette) -->
    <!-- North -->
    <path d="M24 13 C21.5 17.5 21.5 20.5 24 24 C26.5 20.5 26.5 17.5 24 13 Z" fill="url(#petalGold)"/>
    <!-- South -->
    <path d="M24 35 C21.5 30.5 21.5 27.5 24 24 C26.5 27.5 26.5 30.5 24 35 Z" fill="url(#petalGold)"/>
    <!-- West -->
    <path d="M13 24 C17.5 21.5 20.5 21.5 24 24 C20.5 26.5 17.5 26.5 13 24 Z" fill="url(#petalGold)"/>
    <!-- East -->
    <path d="M35 24 C30.5 21.5 27.5 21.5 24 24 C27.5 26.5 30.5 26.5 35 24 Z" fill="url(#petalGold)"/>
    <!-- North-West -->
    <path d="M16.2 16.2 C19.5 19 21.5 21 24 24 C21 21.5 19 19.5 16.2 16.2 Z" fill="url(#petalGold)"/>
    <!-- South-East -->
    <path d="M31.8 31.8 C28.5 29 26.5 27 24 24 C27 26.5 29 28.5 31.8 31.8 Z" fill="url(#petalGold)"/>
    <!-- North-East -->
    <path d="M31.8 16.2 C28.5 19 26.5 21 24 24 C27 21.5 29 19.5 31.8 16.2 Z" fill="url(#petalGold)"/>
    <!-- South-West -->
    <path d="M16.2 31.8 C19.5 29 21.5 27 24 24 C21 26.5 19 28.5 16.2 31.8 Z" fill="url(#petalGold)"/>

    <!-- Petal Tip Beads for South Indian Traditional Jewellery Touch -->
    <circle cx="24" cy="14" r="1.6" fill="url(#centerGold)"/>
    <circle cx="24" cy="34" r="1.6" fill="url(#centerGold)"/>
    <circle cx="14" cy="24" r="1.6" fill="url(#centerGold)"/>
    <circle cx="34" cy="24" r="1.6" fill="url(#centerGold)"/>
    <circle cx="16.9" cy="16.9" r="1.4" fill="url(#centerGold)"/>
    <circle cx="31.1" cy="31.1" r="1.4" fill="url(#centerGold)"/>
    <circle cx="31.1" cy="16.9" r="1.4" fill="url(#centerGold)"/>
    <circle cx="16.9" cy="31.1" r="1.4" fill="url(#centerGold)"/>

    <!-- Outer Brass Rim of Center Stud -->
    <circle cx="24" cy="24" r="5.5" fill="#5A3A05" opacity="0.6"/>
    <!-- Central 3D Domed Flower Boss Stud -->
    <circle cx="24" cy="24" r="4.5" fill="url(#centerGold)"/>
    <!-- Specular Highlight for Gleaming Brass Effect -->
    <circle cx="22.5" cy="22.5" r="1.4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>

